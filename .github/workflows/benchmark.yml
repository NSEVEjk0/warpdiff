name: WarpDiff

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Number of an open pull request in this repository
        required: true
        type: number
      benchmark:
        description: Benchmark in warpdiff.toml (blank uses the default)
        type: string
      profile:
        description: Benchmark duration
        type: choice
        options: [review, showcase, showcase-4090, showcase-a100]
        default: review
      gpu:
        description: Run on just this configured GPU model (optional)
        type: string
      exclude_machine:
        description: Vast machine ID to skip (optional)
        type: number
      comparison_run:
        description: Earlier run ID to include in the report (optional)
        type: number
      max_hourly:
        description: Maximum USD per rental hour
        type: string
        default: '0.85'

permissions:
  actions: read
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: warpdiff-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 54
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          pull_request: ${{ inputs.pull_request }}
          benchmark: ${{ inputs.benchmark }}
          profile: ${{ inputs.profile }}
          gpu: ${{ inputs.gpu }}
          exclude_machine: ${{ inputs.exclude_machine || '' }}
          comparison_run: ${{ inputs.comparison_run || '' }}
          max_hourly: ${{ inputs.max_hourly }}
          vast_api_key: ${{ secrets.VASTAI_API_KEY }}
